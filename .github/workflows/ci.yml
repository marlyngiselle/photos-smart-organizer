name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Pure logic (ubuntu, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

  macos:
    name: macOS (tests, LaunchAgent plist, JXA compile)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install (with the osxphotos extra, imported but never pointed at a library)
        run: python -m pip install -e ".[dev,macos]"
      - name: Pytest
        run: pytest
      - name: Render the LaunchAgent and lint it with plutil
        run: |
          out="$RUNNER_TEMP/agent"
          plist="$(photosorg install-agent --render-only --output "$out" --interval 30)"
          plutil -lint "$plist"
          plutil -p "$plist"
      - name: Compile the JXA bridge (syntax only, Photos is never launched)
        run: |
          for f in src/photosorg/jxa/*.js; do
            osacompile -l JavaScript -o "$RUNNER_TEMP/$(basename "$f" .js).scpt" "$f"
            echo "compiled $f"
          done
      - name: Demo end to end on synthetic fixtures
        run: |
          photosorg --demo plan --explain --limit 5
          photosorg --demo --state "$RUNNER_TEMP/state.sqlite3" run
          photosorg --demo --state "$RUNNER_TEMP/state.sqlite3" stats
